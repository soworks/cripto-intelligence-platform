[project]
name = "cip"
version = "0.1.0"
description = "Crypto Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aws-lambda-powertools>=3.35",
  "boto3>=1.43",
  "httpx>=0.28",
  "pydantic>=2.13",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[dynamodb,iam,ssm,stepfunctions]>=1.43",
  "hypothesis>=6.0",
  "moto[dynamodb,iam,ssm,stepfunctions]>=5.2",
  "mypy>=1.15",
  "pip-audit>=2.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["cip"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: requires deployed AWS dev resources"]

[tool.coverage.run]
branch = true
source = ["cip"]

[tool.coverage.report]
fail_under = 85
show_missing = true
